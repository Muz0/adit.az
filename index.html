<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Пробный сайт</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Пробный сайт. Если понравилось — свяжитесь со мной."
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --muted: #555;
        --accent: #0b6dff;
        --accent-hover: #0856c7;
        --card: #f3f4f6;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0c;
          --fg: #f6f7f8;
          --muted: #bbb;
          --accent: #6aa8ff;
          --accent-hover: #92c0ff;
          --card: #141518;
          --border: #24262a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: 0.2px;
      }
      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: clamp(16px, 2.2vw, 18px);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        padding: 12px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
      }
      .btn.primary:hover {
        background: var(--accent-hover);
      }
      footer {
        margin-top: 28px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>Это был пробный сайт</h1>
      <p class="lead">
        Если он вам понравился, вы можете связаться со мной удобным способом
        ниже.
      </p>

      <div class="actions" role="group" aria-label="Варианты связи">
        <!-- Замените почту, телефон и ссылки на свои -->
        <!-- <a
          class="btn primary"
          href="mailto:you@example.com?subject=Интерес к вашему сайту"
          >Написать на почту</a
        > -->
        <a class="btn primary" href="tel:++994709966399">Позвонить</a>
        <!-- <a
          class="btn"
          href="https://t.me/your_username"
          target="_blank"
          rel="noopener"
          >Telegram</a
        > -->
        <a
          class="btn"
          href="https://wa.me/994709966399"
          target="_blank"
          rel="noopener"
          >WhatsApp</a
        >
      </div>

      <footer>© 2025 Музаффар Мустафаев. Все права защищены.</footer>
    </main>
  </body>
</html>
